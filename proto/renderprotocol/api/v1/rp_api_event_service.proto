syntax = "proto3";

package proto.renderprotocol.api.v1;

import "proto/renderprotocol/api/v1/rp_api_metadata.proto";
import "proto/renderprotocol/api/v1/rp_api_status.proto";

option cc_enable_arenas = true;
option java_package = "com.nukive.renderprotocol.api.v1";
option objc_class_prefix = "";
option optimize_for = SPEED;
option swift_prefix = "";

// ─────────────────────────────────────────────────────────
// Submit Event
// ─────────────────────────────────────────────────────────

message RPSubmitEventRequest {
  RPSessionContext context = 1;
  string view_id = 2;
  string event_id = 3;
  RPEventType event_type = 4;
  RPEventPayload payload = 5;
  int64 timestamp_unix = 6;
}

message RPSubmitEventResponse {
  RPStatus status = 1;
}

// ─────────────────────────────────────────────────────────
// Batch Events
// ─────────────────────────────────────────────────────────

message RPSubmitBatchEventsRequest {
  RPSessionContext context = 1;
  repeated RPSubmitEventRequest events = 2;
}

message RPSubmitBatchEventsResponse {
  RPStatus status = 1;
  int32 accepted_count = 2;
  int32 rejected_count = 3;
}

// ─────────────────────────────────────────────────────────
// Event Types & Payloads
// ─────────────────────────────────────────────────────────

enum RPEventType {
  RP_EVENT_TYPE_UNSPECIFIED = 0;
  RP_EVENT_TYPE_VIEW_APPEARED = 1;
  RP_EVENT_TYPE_VIEW_DISAPPEARED = 2;
  RP_EVENT_TYPE_WIDGET_STATE = 3;
  RP_EVENT_TYPE_FORM_SUBMIT = 4;
  RP_EVENT_TYPE_CUSTOM = 5;
}

message RPEventPayload {
  oneof payload {
    RPViewLifecyclePayload view_lifecycle = 1;
    RPWidgetStatePayload widget_state = 2;
    RPFormSubmitPayload form_submit = 3;
    RPCustomEventPayload custom = 4;
  }
}

message RPViewLifecyclePayload {
  string view_id = 1;
  optional int64 duration_ms = 2;
}

message RPWidgetStatePayload {
  string widget_id = 1;
  string field_id = 2;
  string value = 3;
}

message RPFormSubmitPayload {
  string form_id = 1;
  map<string, string> fields = 2;
}

message RPCustomEventPayload {
  string event_name = 1;
  map<string, string> properties = 2;
}

// ─────────────────────────────────────────────────────────
// Service
// ─────────────────────────────────────────────────────────

service RPEventService {
  rpc RPSubmitEvent(RPSubmitEventRequest) returns (RPSubmitEventResponse);
  rpc RPSubmitBatchEvents(RPSubmitBatchEventsRequest) returns (RPSubmitBatchEventsResponse);
}
