syntax = "proto3";

package proto.renderprotocol.api.v1;

import "proto/renderprotocol/api/v1/rp_api_metadata.proto";
import "proto/renderprotocol/api/v1/rp_api_status.proto";

option cc_enable_arenas = true;
option java_multiple_files = true;
option java_outer_classname = "RPGenerated";
option java_package = "com.nukive.renderprotocol.api.v1";
option objc_class_prefix = "";
option optimize_for = SPEED;
option swift_prefix = "";

// ─────────────────────────────────────────────────────────
// Initiate
// ─────────────────────────────────────────────────────────

message RPInitiateRequest {
  RPAppMetadata app_metadata = 1;
  RPDeviceMetadata device_metadata = 2;
}

message RPInitiateResponse {
  RPStatus status = 1;
  string session_token = 2;
  string refresh_token = 3;
  int64 expires_at_unix = 4;
}

// ─────────────────────────────────────────────────────────
// Refresh Session
// ─────────────────────────────────────────────────────────

message RPRefreshSessionRequest {
  string refresh_token = 1;
}

message RPRefreshSessionResponse {
  RPStatus status = 1;
  string session_token = 2;
  string refresh_token = 3;
  int64 expires_at_unix = 4;
}

// ─────────────────────────────────────────────────────────
// End Session
// ─────────────────────────────────────────────────────────

message RPEndSessionRequest {
  string session_token = 1;
}

message RPEndSessionResponse {
  RPStatus status = 1;
}

// ─────────────────────────────────────────────────────────
// Service
// ─────────────────────────────────────────────────────────

service RPHandshakeService {
  rpc RPInitiate(RPInitiateRequest) returns (RPInitiateResponse);
  rpc RPRefreshSession(RPRefreshSessionRequest) returns (RPRefreshSessionResponse);
  rpc RPEndSession(RPEndSessionRequest) returns (RPEndSessionResponse);
}
