syntax = "proto3";

package proto.renderprotocol.api.v1;

import "proto/renderprotocol/api/v1/rp_api_status.proto";

option cc_enable_arenas = true;
option java_multiple_files = true;
option java_outer_classname = "RPGenerated";
option java_package = "proto.renderprotocol.api.v1";
option objc_class_prefix = "";
option optimize_for = SPEED;
option swift_prefix = "";

message RPHealthCheckRequest {}

message RPHealthCheckResponse {
  RPStatus status = 1;
  RPServingStatus serving_status = 2;
  string server_version = 3;
  int64 uptime_seconds = 4;
  string min_sdk_version = 5;
}

enum RPServingStatus {
  RP_SERVING_STATUS_UNSPECIFIED = 0;
  RP_SERVING_STATUS_SERVING = 1;
  RP_SERVING_STATUS_NOT_SERVING = 2;
  RP_SERVING_STATUS_MAINTENANCE = 3;
}

service RPHealthService {
  rpc RPHealthCheck(RPHealthCheckRequest) returns (RPHealthCheckResponse);
}
